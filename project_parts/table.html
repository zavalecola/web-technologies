<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 1: Таблиця</title>
  <style type="text/css">
     table { border-collapse: collapse; width: 400px; margin: 0 auto; }
     td { border: 5px solid #000; }
     tr { width: 60px; height: 60px; }
  </style>
</head>
<body style="text-align: center;">
  <p><a href="../index.html">Повернутись на головну</a></p>

  <table>
    <!-- Ряд 1: верхняя полоса -->
    <tr>
      <td colspan="6" bgcolor="#2bfac4"><br/></td>
    </tr>
    <!-- Ряд 2: вторая полоса сверху -->
    <tr>
      <td rowspan="4" bgcolor="#fbf8d3"><br/></td>
      <td colspan="4" bgcolor="#2bfac4"><br/></td>
      <td rowspan="4" bgcolor="#fbf8d3"><br/></td>
    </tr>
    <!-- Ряд 3: верх центрального квадрата -->
    <tr>
      <td rowspan="2" bgcolor="#fbf8d3"><br/></td>
      <td bgcolor="#ff0000"><br/></td>
      <td bgcolor="#0000ff"><br/></td>
      <td rowspan="2" bgcolor="#fbf8d3"><br/></td>
    </tr>
    <!-- Ряд 4: низ центрального квадрата -->
    <tr>
      <td bgcolor="#00ff00"><br/></td>
      <td bgcolor="#ffff00"><br/></td>
    </tr>
    <!-- Ряд 5: нижняя внутренняя полоса -->
    <tr>
      <td colspan="4" bgcolor="#2bfac4"><br/></td>
    </tr>
    <!-- Ряд 6: нижняя сплошная полоса -->
    <tr>
      <td colspan="6" bgcolor="#2bfac4"><br/></td>
    </tr>
  </table>
</body>
</html>
